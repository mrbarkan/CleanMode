<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CleanMode</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family: 'Geist Sans', -apple-system, BlinkMacSystemFont, "SF Pro", "Helvetica Neue", sans-serif;
        /* Dark base matches the default theme so there's no light frame or
           launch flash before React paints (see also BrowserWindow backgroundColor). */
        background-color: #1B0710;
        color: #F4EEE8;
        overflow: hidden; /* Prevent scrolling */
        -webkit-font-smoothing: antialiased;
      }
      ::selection { background: rgba(111,34,42,0.18); color: inherit; }
      /* Custom scrollbar hide */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* Electron Drag Region */
      .drag-region {
        -webkit-app-region: drag;
      }
      button, input, a {
        -webkit-app-region: no-drag;
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
